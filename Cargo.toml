[package]
name = "rs-img2pnm"
version = "0.1.0"
edition = "2024"

description = "Converts the image to a portable image."
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-img2pnm"
homepage = "https://github.com/takanoriyanagitani/rs-img2pnm"
documentation = "https://docs.rs/rs-img2pnm/latest"
keywords = ["image", "pnm", "pam", "wasi", "convert"]
categories = ["multimedia::Images"]

exclude = [
    "opt.wasm",
    "rs-img2pnm.wasm",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.image]
version = "0.25"
default-features = false
features = [
    "bmp",
    "exr",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "tiff",
    "webp",
]

[dependencies.clap]
version = "4.0"
features = ["derive"]
